name: Generate Release JSON and Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install node-fetch@2

      - name: Generate release.json
        run: node generateRelease.js

      - name: Commit and push release.json
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add release.json
          if git diff --cached --quiet; then
            echo "No changes to release.json; skipping commit."
          else
            git commit -m "Update release.json"
            git push
          fi

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir _site
          cp index.html release.html flasher-download.html _site/
          cp background.js script.js flasher-download.js styles.css favicon.ico release.json _site/
          cp -R firmware _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
